<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#f3efe6"/>
<title>Street Empire</title>
<style>
html{touch-action:manipulation}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;background:#f3efe6;color:#1c2430;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
button{border:0;background:none}
#app{height:100%;display:grid;grid-template-rows:calc(58px + env(safe-area-inset-top,0px)) minmax(0,1fr) calc(68px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:#fffaf1;border-bottom:1px solid #e4d7c2}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;background:#e3b45a;color:#3b2508}
.brand b{display:block;font-size:11px;letter-spacing:1.3px}
.brand small{color:#6d7582;font-size:11px}
.worth{margin-left:auto;font-weight:800;color:#b87414}
#view{overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
#dock{display:flex;background:#fffaf1;border-top:1px solid #e4d7c2;padding-bottom:env(safe-area-inset-bottom,0px)}
#dock button{flex:1;min-height:62px;color:#6d7582;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#dock button.on{color:#b87414;font-weight:800}
.board{background:#fffdf8;border:1px solid #e4d7c2;border-radius:22px;padding:16px 12px 14px;text-align:center;box-shadow:0 8px 20px rgba(80,50,10,.06);margin-bottom:10px}
.lbl{font-size:11px;letter-spacing:1px;color:#6d7582}
.big{font-size:34px;font-weight:800;color:#b87414;margin:6px 0}
.tap{width:168px;height:168px;margin:10px auto 2px;border-radius:50%;font-weight:800;font-size:22px;color:#fff;background:#1b9a84;box-shadow:0 8px 18px rgba(20,110,95,.2);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box,.card,.rowitem{background:#fffdf8;border:1px solid #e4d7c2;border-radius:16px}
.box{padding:10px}
.box span{display:block;font-size:10px;color:#6d7582}
.card{padding:12px;margin-bottom:8px}
.rowitem{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:10px;margin-bottom:8px}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#f2e7d3;font-size:22px}
.btn{min-height:42px;border-radius:12px;padding:8px 12px;font-weight:700;background:#f2e7d3;border:1px solid #e4d7c2}
.gold{background:#e3b45a;color:#3b2508;border:0}
.mint{background:#1b9a84;color:#fff;border:0}
.danger{background:#f3d4d6;color:#8a303c}
.btn:disabled{opacity:.4}
.muted{color:#6d7582;font-size:12px}
.line{display:flex;justify-content:space-between;align-items:center}
.price{color:#b87414;font-weight:800}
.up{color:#1b9a84;font-weight:700}
.dn{color:#c24757;font-weight:700}
.bar{height:7px;background:#eadfca;border-radius:99px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:#e3b45a}
.chips{display:flex;gap:6px;overflow:auto;padding-bottom:8px}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:#efe4cf;color:#5c5346;font-size:12px;font-weight:700}
.chip.on{background:#b87414;color:#fff}
input{width:100%;padding:11px;border-radius:12px;border:1px solid #e4d7c2;background:#fff;margin:6px 0}
#toasts{position:fixed;left:12px;right:12px;top:calc(66px + env(safe-area-inset-top,0px));z-index:50;pointer-events:none}
.toast{background:#fffdf8;border:1px solid #e4d7c2;border-radius:12px;padding:10px;margin-bottom:8px}
#admin{position:fixed;inset:0;z-index:2147483000;background:#f3efe6;display:none;flex-direction:column}
#admin.show{display:flex}
.atop{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 14px;background:#fffaf1;border-bottom:1px solid #e4d7c2}
.abody{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:900px){
#app{grid-template-columns:210px 1fr;grid-template-rows:calc(58px + env(safe-area-inset-top,0px)) 1fr;grid-template-areas:"t t" "d v"}
.top{grid-area:t}#view{grid-area:v}#dock{grid-area:d;flex-direction:column;padding:10px;border-top:0;border-right:1px solid #e4d7c2}
#dock button{flex-direction:row;gap:8px;font-size:13px;min-height:44px}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">SE</div>
    <div class="brand"><b>STREET EMPIRE</b><small id="rankLine">Aurelia · Starter</small></div>
    <div class="worth" id="worthLine">$0</div>
  </header>
  <main id="view">Loading…</main>
  <nav id="dock"></nav>
</div>
<div id="toasts"></div>
<div id="admin"></div>
<script>
(function(){
try{
document.addEventListener("gesturestart", function(e){e.preventDefault();}, {passive:false});
document.addEventListener("dblclick", function(e){e.preventDefault();}, {passive:false});
var KEY="se-light-v1", CODE="FERRARI1";
var RANKS=[[0,"Starter"],[80,"Clerk"],[220,"Owner"],[500,"Investor"],[1100,"Director"],[2200,"Tycoon"],[4500,"Mogul"],[8000,"Magnate"]];
var CATS=["Shop","Works","Kitchen","Builder","Motors","Labs","Bank","Energy"];
var BIZ=[
  {id:"kiosk",n:"Lane Kiosk",i:"🏪",c:"Shop",p:400,h:18,max:20},
  {id:"cart",n:"Corner Cart",i:"🌮",c:"Kitchen",p:700,h:28,max:18},
  {id:"mart",n:"Night Mart",i:"🛒",c:"Shop",p:2200,h:70,max:20},
  {id:"cafe",n:"Harbor Roast",i:"☕",c:"Kitchen",p:2600,h:82,max:20},
  {id:"shed",n:"River Shed",i:"🏭",c:"Works",p:3500,h:95,max:20},
  {id:"yard",n:"Brick Yard",i:"🧱",c:"Builder",p:8000,h:160,max:20},
  {id:"lot",n:"Apex Lot",i:"🚗",c:"Motors",p:18000,h:380,max:20},
  {id:"desk",n:"Pixel Desk",i:"💻",c:"Labs",p:24000,h:520,max:20},
  {id:"mall",n:"Arcade Hall",i:"🏬",c:"Shop",p:28000,h:620,max:22},
  {id:"hall",n:"Goldfork",i:"🍽️",c:"Kitchen",p:36000,h:760,max:22},
  {id:"plant",n:"Forge Plant",i:"⚙️",c:"Works",p:42000,h:880,max:22},
  {id:"crew",n:"Skyline Crew",i:"🏗️",c:"Builder",p:64000,h:1200,max:22},
  {id:"vault",n:"Ledger Vault",i:"🏦",c:"Bank",p:90000,h:1600,max:24},
  {id:"show",n:"Crown Motors",i:"🏎️",c:"Motors",p:120000,h:2100,max:22},
  {id:"labs",n:"Lumen Labs",i:"🖥️",c:"Labs",p:180000,h:3200,max:22},
  {id:"well",n:"Helios Yard",i:"⛽",c:"Energy",p:220000,h:3800,max:24},
  {id:"hold",n:"Aurelia Hold",i:"🏛️",c:"Bank",p:750000,h:9800,max:24},
  {id:"field",n:"North Field",i:"🛢️",c:"Energy",p:1800000,h:24000,max:24}
].sort(function(a,b){return a.p-b.p;});
var HOMES=[
  {id:"studio",n:"Canal Studio",i:"🏠",p:12000,r:55,max:5},
  {id:"row",n:"Maple Row",i:"🏡",p:28000,r:120,max:5},
  {id:"loft",n:"Dock Loft",i:"🪟",p:76000,r:280,max:5},
  {id:"suite",n:"Ledger Suite",i:"🏢",p:180000,r:620,max:5},
  {id:"villa",n:"Vista Villa",i:"🌅",p:420000,r:1400,max:5},
  {id:"manor",n:"Crown Manor",i:"🏰",p:1600000,r:4800,max:5}
];
var CARS=[
  {id:"city",n:"City Hatch",i:"🚗",p:8000,h:12},
  {id:"sedan",n:"Aurelia Sedan",i:"🚘",p:28000,h:40},
  {id:"sport",n:"Ridge Sport",i:"🏎️",p:120000,h:140},
  {id:"limo",n:"Night Limo",i:"🚖",p:260000,h:280},
  {id:"jet",n:"Sky Runner",i:"✈️",p:1800000,h:1600}
];
var TICK=[
  {id:"AUR",n:"Aurelia Goods",base:18},
  {id:"NTH",n:"Northlight",base:24},
  {id:"HLS",n:"Helios Energy",base:31},
  {id:"PIX",n:"Pixel Desk",base:22},
  {id:"CRW",n:"Crown Hold",base:44},
  {id:"RVR",n:"Riverline",base:16}
];
function money(n){var a=Math.abs(n),s=n<0?"-":"";if(a>=1e9)return s+"$"+(a/1e9).toFixed(2)+"B";if(a>=1e6)return s+"$"+(a/1e6).toFixed(2)+"M";if(a>=10000)return s+"$"+(a/1e3).toFixed(1)+"K";if(a>=100)return s+"$"+Math.floor(a).toLocaleString();return s+"$"+a.toFixed(2);}
function def(id){for(var i=0;i<BIZ.length;i++) if(BIZ[i].id===id) return BIZ[i];}
function homeD(id){for(var i=0;i<HOMES.length;i++) if(HOMES[i].id===id) return HOMES[i];}
function carD(id){for(var i=0;i<CARS.length;i++) if(CARS[i].id===id) return CARS[i];}
function rate(b){return def(b.id).h*(1+(b.lv-1)*0.16);}
function upCost(b){return Math.floor(def(b.id).p*0.32*Math.pow(1.2,b.lv-1));}
function homeRate(h){return homeD(h.id).r*(1+h.imp*0.22);}
function tapVal(){return 1+S.tapLv*2+S.cars.length;}
function hour(){var n=0,k,i,c;for(k in S.biz) n+=rate(S.biz[k]);for(k in S.homes) n+=homeRate(S.homes[k]);for(i=0;i<S.cars.length;i++){c=carD(S.cars[i]); if(c) n+=c.h;}return n;}
function worth(){var n=S.cash,k,i,c;for(k in S.biz) n+=def(k).p*S.biz[k].lv*0.7+S.biz[k].store;for(k in S.homes) n+=homeD(k).p;for(i=0;i<S.cars.length;i++){c=carD(S.cars[i]); if(c) n+=c.p*0.6;}for(i=0;i<TICK.length;i++) n+=(S.shares[TICK[i].id]||0)*(S.px[TICK[i].id]||0);return n;}
function rank(){var i=0,x;for(x=0;x<RANKS.length;x++) if(S.xp>=RANKS[x][0]) i=x;var cur=RANKS[i], nxt=RANKS[i+1], span=nxt?nxt[0]-cur[0]:1;return {name:cur[1], pct:nxt?Math.min(1,(S.xp-cur[0])/span):1};}
function ensureMarket(){if(!S.px) S.px={};if(!S.prev) S.prev={};if(!S.shares) S.shares={};for(var i=0;i<TICK.length;i++){if(!(S.px[TICK[i].id]>0)) S.px[TICK[i].id]=TICK[i].base;if(!S.prev[TICK[i].id]) S.prev[TICK[i].id]=S.px[TICK[i].id];if(!(S.shares[TICK[i].id]>=0)) S.shares[TICK[i].id]=0;}}
var S, tab="earn", filter="All", lastTap=0;
function fresh(){var px={}, prev={}, i;for(i=0;i<TICK.length;i++){px[TICK[i].id]=TICK[i].base; prev[TICK[i].id]=TICK[i].base;}return {cash:0,xp:0,tapLv:0,biz:{},homes:{},cars:[],shares:{},px:px,prev:prev,stats:{taps:0,earned:0},last:Date.now(),name:"Founder",build:null};}
function load(){try{ var raw=localStorage.getItem(KEY); S=raw?Object.assign(fresh(),JSON.parse(raw)):fresh(); }catch(e){ S=fresh(); }if(!S.biz) S.biz={}; if(!S.homes) S.homes={}; if(!S.cars) S.cars=[];ensureMarket();}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function toast(m){var h=document.getElementById("toasts"), e=document.createElement("div");e.className="toast"; e.textContent=m; h.insertBefore(e,h.firstChild);setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); }, 2200);}
function tick(ms){var hr=ms/3600000,k,i,c,chg;for(k in S.biz) S.biz[k].store+=rate(S.biz[k])*hr;for(k in S.homes) S.cash+=homeRate(S.homes[k])*hr;for(i=0;i<S.cars.length;i++){c=carD(S.cars[i]); if(c) S.cash+=c.h*hr;}ensureMarket();for(i=0;i<TICK.length;i++){S.prev[TICK[i].id]=S.px[TICK[i].id];chg=(Math.random()-0.47)*1.4;S.px[TICK[i].id]=Math.max(2, +(S.px[TICK[i].id]*(1+chg/100)).toFixed(2));}if(S.build && Date.now()>=S.build.done){S.cash+=S.build.pay; S.stats.earned+=S.build.pay; S.xp+=8;toast("Build finished +"+money(S.build.pay)); S.build=null; if(tab==="biz") paint();}S.last=Date.now();}
function collect(){var n=0,k; for(k in S.biz){ n+=S.biz[k].store; S.biz[k].store=0; }if(n<1){ toast("Nothing to collect"); return; }S.cash+=n; S.stats.earned+=n; S.xp+=Math.max(1, Math.floor(n/4000));toast("Collected "+money(n)); paint(); save();}
function buyBiz(id){var b=def(id); if(!b||S.biz[id]||S.cash<b.p) return;S.cash-=b.p; S.biz[id]={id:id,lv:1,store:0}; S.xp+=8; toast("Opened "+b.n); paint(); save();}
function upBiz(id){var inst=S.biz[id], b=def(id); if(!inst||inst.lv>=b.max) return;var c=upCost(inst); if(S.cash<c){ toast("Need "+money(c)); return; }S.cash-=c; inst.lv++; S.xp+=4; toast(b.n+" lv "+inst.lv); paint(); save();}
function buyHome(id){var h=homeD(id); if(!h||S.homes[id]||S.cash<h.p) return;S.cash-=h.p; S.homes[id]={id:id,imp:0}; S.xp+=6; toast("Bought "+h.n); paint(); save();}
function impHome(id){var h=S.homes[id], d=homeD(id); if(!h||h.imp>=d.max) return;var c=Math.floor(d.p*0.18*(h.imp+1)); if(S.cash<c){ toast("Need "+money(c)); return; }S.cash-=c; h.imp++; S.xp+=3; toast(d.n+" improved"); paint(); save();}
function buyCar(id){var c=carD(id); if(!c||S.cars.indexOf(id)>=0||S.cash<c.p) return;S.cash-=c.p; S.cars.push(id); S.xp+=5; toast("Parked "+c.n); paint(); save();}
function buyShare(id){ensureMarket();var cost=S.px[id];if(!(cost>0)){ toast("Market not ready"); return; }if(S.cash<cost){ toast("Need "+money(cost)); return; }S.cash-=cost; S.shares[id]=(S.shares[id]||0)+1; S.xp+=1;toast("Bought 1 "+id+" at "+money(cost)); paint(); save();}
function sellShare(id){ensureMarket();if(!(S.shares[id]>0)){ toast("You do not hold "+id); return; }S.shares[id]--; S.cash+=S.px[id];toast("Sold 1 "+id+" at "+money(S.px[id])); paint(); save();}
function startBuild(){if(!S.biz.yard && !S.biz.crew){ toast("Open a Builder firm first"); return; }if(S.build){ toast("A job is already running"); return; }var cost=S.biz.crew?6000:1800, pay=S.biz.crew?16000:4800, wait=S.biz.crew?25000:18000;if(S.cash<cost){ toast("Need "+money(cost)); return; }S.cash-=cost; S.build={done:Date.now()+wait, pay:pay}; toast("Crew started a build"); paint(); save();}
function paint(){var r=rank();document.getElementById("rankLine").textContent="Aurelia · "+r.name;document.getElementById("worthLine").textContent=money(worth());var dock=document.getElementById("dock"), tabs=[["earn","💵","Income"],["biz","🏢","Business"],["home","🏠","Estate"],["mkt","📈","Invest"],["life","✨","Style"]], html="",i;for(i=0;i<tabs.length;i++) html+='<button class="'+(tab===tabs[i][0]?"on":"")+'" data-tab="'+tabs[i][0]+'" type="button"><span>'+tabs[i][1]+"</span>"+tabs[i][2]+"</button>";dock.innerHTML=html;document.getElementById("view").innerHTML=({earn:vEarn,biz:vBiz,home:vHome,mkt:vMkt,life:vLife}[tab])();}
function vEarn(){var stored=0,k,r=rank();for(k in S.biz) stored+=S.biz[k].store;return '<section class="board"><div class="lbl">CASH ON HAND</div><div class="big" id="cashBig">'+money(S.cash)+'</div><div class="muted">'+money(hour())+"/hr idle · tap "+money(tapVal())+'</div><button class="tap" id="tap" type="button">TAP</button></section>'+'<div class="g2"><div class="box"><span>NET WORTH</span><b>'+money(worth())+'</b></div><div class="box"><span>STORED</span><b>'+money(stored)+'</b></div><div class="box"><span>RANK</span><b>'+r.name+'</b></div><div class="box"><span>FIRMS</span><b>'+Object.keys(S.biz).length+'</b></div></div>'+'<div class="bar"><i style="width:'+Math.round(r.pct*100)+'%"></i></div>'+'<div class="g2"><button class="btn mint" data-a="collect" type="button">Collect firms</button><button class="btn gold" data-a="tapup" type="button">Better tap '+money(40+S.tapLv*55)+"</button></div>"+(S.build?'<div class="card" style="margin-top:10px"><b>Build in progress</b><div class="muted">Payout '+money(S.build.pay)+"</div></div>":"");}
function vBiz(){var html='<div class="chips"><button class="chip '+(filter==="All"?"on":"")+'" data-f="All" type="button">All</button>',i,b,o,list=[];for(i=0;i<CATS.length;i++) html+='<button class="chip '+(filter===CATS[i]?"on":"")+'" data-f="'+CATS[i]+'" type="button">'+CATS[i]+"</button>";html+="</div>";if(filter==="Builder"||S.biz.yard||S.biz.crew) html+='<button class="btn gold" data-a="build" type="button" style="width:100%;margin-bottom:8px">'+(S.build?"Build running…":"Start a construction job")+"</button>";for(i=0;i<BIZ.length;i++) if(filter==="All"||BIZ[i].c===filter) list.push(BIZ[i]);list.sort(function(a,b){return a.p-b.p;});for(i=0;i<list.length;i++){b=list[i]; o=S.biz[b.id];html+='<article class="rowitem"><div class="ico">'+b.i+'</div><div><b>'+b.n+'</b><div class="muted">'+b.c+" · "+(o?("Lv "+o.lv+" · "+money(rate(o))+"/hr"):money(b.h)+"/hr")+"</div></div>";if(o) html+='<button class="btn gold" data-up="'+b.id+'" type="button">'+(o.lv>=b.max?"Max":money(upCost(o)))+"</button>";else html+='<button class="btn gold" data-buy="'+b.id+'" '+(S.cash<b.p?"disabled":"")+' type="button">'+money(b.p)+"</button>";html+="</article>";}return html;}
function vHome(){var html="",i,h,o;for(i=0;i<HOMES.length;i++){h=HOMES[i]; o=S.homes[h.id];html+='<article class="rowitem"><div class="ico">'+h.i+'</div><div><b>'+h.n+'</b><div class="muted">'+(o?("Imp "+o.imp+"/"+h.max+" · "+money(homeRate(o))+"/hr"):money(h.r)+"/hr rent")+"</div></div>";if(o) html+='<button class="btn gold" data-imp="'+h.id+'" type="button">'+(o.imp>=h.max?"Max":money(Math.floor(h.p*0.18*(o.imp+1))))+"</button>";else html+='<button class="btn gold" data-home="'+h.id+'" '+(S.cash<h.p?"disabled":"")+' type="button">'+money(h.p)+"</button>";html+="</article>";}return html;}
function vMkt(){ensureMarket();var html='<div class="muted" style="margin-bottom:8px">Prices move every second. Buy 1 share or sell 1 share.</div>',i,t,have,diff,cls,sign;for(i=0;i<TICK.length;i++){t=TICK[i]; have=S.shares[t.id]||0; diff=S.px[t.id]-(S.prev[t.id]||S.px[t.id]);cls=diff>=0?"up":"dn"; sign=diff>=0?"+":"";html+='<article class="card"><div class="line"><b>'+t.id+'</b><span class="price">'+money(S.px[t.id])+'</span></div><div class="muted">'+t.n+'</div><div class="line"><span class="muted">You hold '+have+'</span><span class="'+cls+'">'+sign+diff.toFixed(2)+'</span></div><div class="g2" style="margin-top:8px"><button class="btn gold" data-bs="'+t.id+'" type="button">Buy 1</button><button class="btn" data-ss="'+t.id+'" type="button">Sell 1</button></div></article>';}return html;}
function vLife(){var html='<div class="card"><label class="muted">Display name</label><input id="nm" value="'+S.name+'" maxlength="16"><label class="muted">Access code</label><input id="cd" placeholder="Enter code" autocomplete="off"><button class="btn gold" data-a="code" type="button">Submit code</button></div><h3>Garage</h3>',i,c,have;for(i=0;i<CARS.length;i++){c=CARS[i]; have=S.cars.indexOf(c.id)>=0;html+='<article class="rowitem"><div class="ico">'+c.i+'</div><div><b>'+c.n+'</b><div class="muted">+'+money(c.h)+'/hr</div></div><button class="btn gold" data-car="'+c.id+'" '+(have||S.cash<c.p?"disabled":"")+' type="button">'+(have?"Owned":money(c.p))+"</button></article>";}html+='<button class="btn danger" data-a="reset" type="button" style="width:100%;margin-top:8px">Reset save</button>';return html;}
function doTap(e){if(e) e.preventDefault();var now=Date.now();if(now-lastTap<80) return;lastTap=now;var add=tapVal();S.cash+=add; S.stats.taps++; S.stats.earned+=add; S.xp+=0.03;var big=document.getElementById("cashBig");if(big) big.textContent=money(S.cash);}
function act(a){if(a==="collect") collect();if(a==="tapup"){ var c=40+S.tapLv*55; if(S.cash<c){toast("Need "+money(c));return;} S.cash-=c; S.tapLv++; toast("Tap is now "+money(tapVal())); paint(); save(); }if(a==="build") startBuild();if(a==="code"){ var box=document.getElementById("cd"); tryCode(box?box.value:""); }if(a==="reset"){ if(confirm("Delete this save?")){ S=fresh(); save(); paint(); } }}
function tryCode(v){if(String(v||"").replace(/^\s+|\s+$/g,"").toUpperCase()===CODE){var a=document.activeElement; if(a&&a.blur) a.blur();setTimeout(openAdmin,80); return true;}toast("Wrong code"); return false;}
function pin(el){var vv=window.visualViewport,t=0,l=0,w=window.innerWidth,h=window.innerHeight;if(vv){ t=Math.round(vv.offsetTop); l=Math.round(vv.offsetLeft); w=Math.round(vv.width); h=Math.round(vv.height); }el.style.cssText="display:flex;position:fixed;z-index:2147483000;top:"+t+"px;left:"+l+"px;width:"+w+"px;height:"+h+"px;background:#f3efe6;flex-direction:column";}
function openAdmin(){var el=document.getElementById("admin"); el.className="show"; pin(el);el.innerHTML='<div class="atop"><div><div class="muted">CONSOLE</div><h3 style="margin:0;color:#b87414">FERRARI1</h3></div><button class="btn gold" id="ax" type="button">Close</button></div><div class="abody"><button class="btn" data-c="100000" type="button">+$100K</button><button class="btn" data-c="1000000" type="button">+$1M</button><button class="btn" data-c="100000000" type="button">+$100M</button><button class="btn" data-x="1" type="button">+500 XP</button><button class="btn danger" data-r="1" type="button">Reset</button></div>';document.getElementById("ax").onclick=closeAdmin;var list=el.querySelectorAll("[data-c]"),i;for(i=0;i<list.length;i++) list[i].onclick=function(){ S.cash+=Number(this.getAttribute("data-c")); save(); paint(); openAdmin(); };el.querySelector("[data-x]").onclick=function(){ S.xp+=500; save(); paint(); openAdmin(); };el.querySelector("[data-r]").onclick=function(){ if(confirm("Reset?")){ S=fresh(); closeAdmin(); save(); paint(); } };}
function closeAdmin(){ var el=document.getElementById("admin"); el.className=""; el.innerHTML=""; el.removeAttribute("style"); }
document.addEventListener("pointerup", function(e){var t=e.target.closest ? e.target.closest("[data-tab],[data-f],[data-buy],[data-up],[data-home],[data-imp],[data-car],[data-bs],[data-ss],[data-a],#tap") : null;if(!t) return;if(t.id==="tap"){ e.preventDefault(); doTap(e); return; }if(t.getAttribute("data-tab")){ tab=t.getAttribute("data-tab"); paint(); return; }if(t.getAttribute("data-f")){ filter=t.getAttribute("data-f"); paint(); return; }if(t.getAttribute("data-buy")) buyBiz(t.getAttribute("data-buy"));if(t.getAttribute("data-up")) upBiz(t.getAttribute("data-up"));if(t.getAttribute("data-home")) buyHome(t.getAttribute("data-home"));if(t.getAttribute("data-imp")) impHome(t.getAttribute("data-imp"));if(t.getAttribute("data-car")) buyCar(t.getAttribute("data-car"));if(t.getAttribute("data-bs")) buyShare(t.getAttribute("data-bs"));if(t.getAttribute("data-ss")) sellShare(t.getAttribute("data-ss"));if(t.getAttribute("data-a")) act(t.getAttribute("data-a"));}, {passive:false});
document.addEventListener("change", function(e){if(e.target && e.target.id==="nm"){ S.name=e.target.value.slice(0,16)||"Founder"; save(); }});
function boot(){load();var away=Date.now()-S.last;if(away>12000){var cap=Math.min(away,8*3600000), before=S.cash,k;for(k in S.biz) before+=S.biz[k].store;tick(cap);var after=S.cash; for(k in S.biz) after+=S.biz[k].store;if(after-before>1) toast("While away "+money(after-before));}paint();setInterval(function(){tick(1000);if(tab==="mkt") paint();else {var big=document.getElementById("cashBig");if(big) big.textContent=money(S.cash);document.getElementById("worthLine").textContent=money(worth());}save();},1000);}
boot();
}catch(err){document.getElementById("view").textContent="Game error: "+err;}
})();
</script>
</body>
</html>
