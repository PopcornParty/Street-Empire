<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#08101c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>STREET EMPIRE</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="logo" id="logo-btn" type="button" aria-label="Street Empire">SE</button>
      <div class="brand">
        <strong>STREET EMPIRE</strong>
        <small id="rank-label">Starter</small>
      </div>
      <div class="chips">
        <div class="chip"><span>CASH</span><b id="cash-label">$10,000</b></div>
        <div class="chip"><span>/HR</span><b id="rate-label">$0</b></div>
      </div>
    </header>
    <main id="view" class="view"></main>
    <nav class="dock" id="dock"></nav>
  </div>
  <div id="sheet" hidden></div>
  <div id="toasts"></div>
  <div id="admin" hidden></div>
  <script src="js/app.js"></script>
</body>
</html>
